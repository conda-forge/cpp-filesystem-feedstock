schema_version: 1

context:
  name: cpp-filesystem
  version: "1.5.16"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/gulrak/filesystem/archive/v${{ version }}.tar.gz
  sha256: f4a098ed48e3b25b87b2be84cde58c884177af6b4ce27666ed2dbfe907b24418

build:
  number: 0

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja

tests:
  - package_contents:
      include:
        - ghc/filesystem.hpp
      files:
        - if: unix
          then:
            - lib/cmake/ghc_filesystem/ghc_filesystem-config.cmake
        - if: win
          then:
            - Library/lib/cmake/ghc_filesystem/ghc_filesystem-config.cmake

about:
  license: MIT
  license_file: LICENSE
  summary: An implementation of C++17 std::filesystem
  description: An implementation of C++17 std::filesystem for C++11 /C++14/C++17 on Windows, macOS, Linux and FreeBSD.
  homepage: https://github.com/gulrak/filesystem

extra:
  recipe-maintainers:
    - SylvainCorlay
    - JohanMabille
    - baszalmstra
    - luhenry
